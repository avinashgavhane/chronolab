name: ChronoLab CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Execute Automated Regression Test Suite
        env:
          FLASK_ENV: testing
        run: |
          pytest -v tests/

      - name: Verify Health Endpoint Response
        env:
          FLASK_ENV: testing
        run: |
          python -c "from app import create_app; app = create_app('testing'); client = app.test_client(); resp = client.get('/healthz'); assert resp.status_code == 200; print('HEALTH CHECK PASSED')"
