{% extends "base.html" %}

{% block title %}Register Patient Account | ChronoLab{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xl mx-auto shadow-inner">
                📋
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Health Vault</h1>
            <p class="text-xs text-slate-500">Your profile will be assigned an anonymous Universal Health ID (ChronoID).</p>
        </div>

        <form action="{{ url_for('register_page') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full Legal Name</label>
                <input type="text" name="full_name" required placeholder="e.g. Aditi Sharma" class="w-full text-xs border border-slate-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="aditi@example.com" class="w-full text-xs border border-slate-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Minimum 6 characters" class="w-full text-xs border border-slate-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50/50">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Date of Birth</label>
                    <input type="date" name="date_of_birth" required class="w-full text-xs border border-slate-200 rounded-xl p-3 bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Biological Sex</label>
                    <select name="biological_sex" class="w-full text-xs border border-slate-200 rounded-xl p-3 bg-slate-50/50">
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Blood Group (Optional)</label>
                <select name="blood_group" class="w-full text-xs border border-slate-200 rounded-xl p-3 bg-slate-50/50">
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md shadow-emerald-500/20 active:scale-95">
                Generate ChronoID & Create Vault
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500">
            Already registered? 
            <a href="{{ url_for('login_page') }}" class="font-bold text-brand-600 hover:underline">Log in here</a>
        </div>
    </div>

</div>
{% endblock %}
